name: Build and Push Curator Images

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Curator service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            painaidee/curator-agent:latest
            painaidee/curator-agent:${{ github.sha }}

      - name: Build and push Curator sandbox worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          push: true
          tags: |
            painaidee/curator-sandbox-worker:latest
            painaidee/curator-sandbox-worker:${{ github.sha }}

      - name: Build and push isolated skill sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: |
            painaidee/curator-skill-sandbox:latest
            painaidee/curator-skill-sandbox:${{ github.sha }}
